name: brain_duel
description: "Brain Duel — Trivia PvP with collectible question cards."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.6.1

  # Routing
  go_router: ^14.6.2

  # Typography & icons
  google_fonts: ^6.2.1
  lucide_icons_flutter: ^3.0.5

  # Animation & juice
  flutter_animate: ^4.5.2

  # Local persistence
  shared_preferences: ^2.3.4

  # Utils
  intl: ^0.20.1
  uuid: ^4.5.1

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  fonts:
    - family: Fraunces
      fonts:
        - asset: assets/fonts/Fraunces.ttf
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter.ttf
